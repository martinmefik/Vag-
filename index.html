        :root {
            --bg: #f5f7fa;

            --primary-light: #dbeafe;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
            padding: 24px 16px 60px;
        }
        .container { max-width: 1280px; margin: 0 auto; }
        header { margin-bottom: 28px; text-align: center; }
        h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; max-width: 760px; margin: 0 auto; }
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            background: var(--card-bg);
            padding: 18px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
            position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(8px);
        }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; }
        select, input[type="text"] {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
            font-size: 0.9rem; background: #fff; outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        select:focus, input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
        .stats { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        .stats strong { color: var(--text); }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 18px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
        .card-title { font-weight: 650; font-size: 1rem; line-height: 1.35; }
        .badge {
            font-size: 0.65rem; padding: 3px 10px; border-radius: 999px;
            background: var(--primary-light); color: var(--primary); font-weight: 600; white-space: nowrap; flex-shrink: 0;
        }
        .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--border); }
        .empty {
            grid-column: 1 / -1; text-align: center; padding: 60px 20px;
            color: var(--text-muted); background: var(--card-bg); border-radius: 16px; border: 1px dashed var(--border);
        }
        .empty-icon { font-size: 2rem; margin-bottom: 10px; }
        @media (max-width: 640px) {
            body { padding: 14px 10px 40px; }
            h1 { font-size: 1.45rem; }
            .filters { grid-template-columns: 1fr; position: static; }
            .cards { grid-template-columns: 1fr; }
        }

        // --- БЕЗОПАСНОСТЬ ---
        {
            name: 'Косвенное измерение давления в шинах (TPMS)',
            category: 'Безопасность',
            models: ['vw-golf-6','vw-golf-7','vw-passat-b8','vw-tiguan-ad','skoda-octavia-a7','skoda-superb-b8','skoda-kodiaq','seat-leon-mk3','seat-ateca']

            category: 'Безопасность',
            models: ['vw-golf-5','vw-golf-6','vw-golf-7','vw-passat-b6','vw-passat-b7','vw-passat-b8','skoda-octavia-a5','skoda-octavia-a7','seat-leon-mk3']
        },
        {
            name: 'Отключение старт-стоп системы',
            category: 'Безопасность',

    ];

    // ======================== ЛОГИКА ========================
    const brandSelect = document.getElementById('brandSelect');
    const modelSelect = document.getElementById('modelSelect');
    const categorySelect = document.getElementById('categorySelect');
    const searchInput = document.getElementById('searchInput');
    const cardsContainer = document.getElementById('cards');
    const statsEl = document.getElementById('stats');

    function initBrands() {
        const brands = [...new Set(models.map(m => m.brand))].sort();
        brands.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b; opt.textContent = b;
            brandSelect.appendChild(opt);
        });
    }

    function refreshModels(brand) {
        modelSelect.innerHTML = '<option value="">Все модели</option>';
        const filtered = brand ? models.filter(m => m.brand === brand) : models;
        filtered.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = `${m.model} (${m.years})`;
            modelSelect.appendChild(opt);
        });
    }

    function initCategories() {
        const cats = [...new Set(features.map(f => f.category))].sort();
        cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c; opt.textContent = c;
            categorySelect.appendChild(opt);
        });
    }

    function modelNamesForFeature(feature) {
        const names = feature.models.map(id => {
            const m = models.find(x => x.id === id);
            return m ? `${m.brand} ${m.model}` : id;
        });
        const unique = [...new Set(names)];
        if (unique.length > 3) {
            return unique.slice(0, 3).join(', ') + ` и ещё ${unique.length - 3}...`;
        }
        return unique.join(', ');
    }

    function render() {
        const brand = brandSelect.value;
        const modelId = modelSelect.value;
        const category = categorySelect.value;
        const query = searchInput.value.trim().toLowerCase();

        let filteredModels = models;
        if (brand) filteredModels = filteredModels.filter(m => m.brand === brand);
        if (modelId) filteredModels = filteredModels.filter(m => m.id === modelId);

        let visible = features;

        if (modelId) {
            visible = visible.filter(f => f.models.includes(modelId));
        } else if (brand) {
            const idsInBrand = new Set(filteredModels.map(m => m.id));
            visible = visible.filter(f => f.models.some(id => idsInBrand.has(id)));
        }

        if (category) visible = visible.filter(f => f.category === category);
        if (query) visible = visible.filter(f => f.name.toLowerCase().includes(query));

        // Статистика
        if (visible.length === 0) {
            statsEl.innerHTML = 'Ничего не найдено. Попробуйте изменить фильтры.';
        } else {
            statsEl.innerHTML = `Найдено функций: <strong>${visible.length}</strong>`;
        }

        cardsContainer.innerHTML = '';
        if (visible.length === 0) {
            cardsContainer.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>По выбранным фильтрам функций нет.<br>Попробуйте сбросить фильтры или изменить запрос.</div>`;
            return;
        }

        visible.forEach(f => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-top">
                    <span class="card-title">${f.name}</span>
                    <span class="badge">${f.category}</span>
                </div>
                <div class="card-meta">${modelNamesForFeature(f)}</div>
            `;
            cardsContainer.appendChild(card);
        });
    }

    // Инициализация
    initBrands();
    refreshModels('');
    initCategories();
    render();

    // События
    brandSelect.addEventListener('change', () => {
        refreshModels(brandSelect.value);
        render();
    });
    modelSelect.addEventListener('change', render);
    categorySelect.addEventListener('change', render);
    searchInput.addEventListener('input', render);
</script>
